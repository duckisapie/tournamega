name: TournamentPlugin
version: 1.0.0
description: Command-based survival tournament plugin
author: Tournament Admin
main: com.tournament.TournamentPlugin
api-version: '1.21'

depend:
  - Multiverse-Core

commands:
  tournament:
    description: Tournament plugin main command
    usage: /tournament <start [numberh|numberd|numberw|numberm]|stop|status>
commands:
  tournament:
    description: Tournament plugin main command
    usage: /tournament <start|stop|status>
    permission: tournament.admin
    aliases:
      - tour
      - tourney

permissions:
  tournament.admin:
    description: Admin permissions for tournament plugin
    default: op
  tournament.join:
    description: Permission to join tournament
    default: true
