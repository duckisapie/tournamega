# Tournament configuration. A kit with rarity 1.0 is issued to every player
# after they select a team; all other kits are weighted chest loot.
teams:
  red:
    name: "Red Team"
    color: "RED"
  blue:
    name: "Blue Team"
    color: "BLUE"
  green:
    name: "Green Team"
    color: "GREEN"
  yellow:
    name: "Yellow Team"
    color: "YELLOW"

kits:
  starter:
    name: "Starter Kit"
    rarity: 1.0
    items:
      1: { material: "WOODEN_PICKAXE", amount: 1 }
      2: { material: "WOODEN_AXE", amount: 1 }
      3: { material: "OAK_LOG", amount: 16 }
      4: { material: "OAK_PLANKS", amount: 32 }
      5: { material: "WHEAT_SEEDS", amount: 32 }
  combat:
    name: "Combat Kit"
    rarity: 0.6
    items:
      1: { material: "DIAMOND_SWORD", amount: 1 }
      2: { material: "DIAMOND_PICKAXE", amount: 1 }
      3: { material: "DIAMOND_AXE", amount: 1 }
      4: { material: "STEAK", amount: 32 }
  building:
    name: "Building Kit"
    rarity: 0.5
    items:
      1: { material: "OAK_LOG", amount: 64 }
      2: { material: "OAK_PLANKS", amount: 64 }
      3: { material: "STONE", amount: 64 }
      4: { material: "IRON_BLOCK", amount: 16 }
  utilities:
    name: "Utilities Kit"
    rarity: 0.4
    items:
      1: { material: "GOLDEN_APPLE", amount: 16 }
      2: { material: "ENDER_PEARL", amount: 8 }
      3: { material: "LADDER", amount: 32 }

tournament-world:
  # One randomly positioned chest is added every interval forever while running.
  chest:
    spawn-interval-ticks: 1200
    spawn-radius: 200
    min-distance: 50
  world-border-radius: 300
