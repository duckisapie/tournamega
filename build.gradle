plugins {
	id 'java'
	id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group = 'com.tournament'
version = '1.0.0'
archivesBaseName = 'TournamentPlugin'

repositories {
	mavenCentral()
	maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
	maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
	maven { url 'https://repo.adventureland.app/repository/adventure/' }
	maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
}

dependencies {
	// Spigot API
	compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'

	// Adventure API for color support (Bedrock compatible)
	compileOnly 'net.kyori:adventure-api:4.14.0'
	compileOnly 'net.kyori:adventure-platform-bukkit:4.3.0'

	// Multiverse Core
	compileOnly 'com.onarandombox.multiversecore:Multiverse-Core:4.3.12'

	// Lombok (optional)
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

shadowJar {
	archiveClassifier.set('')
	relocate 'net.kyori', 'com.tournament.libs.kyori'
}

build.dependsOn shadowJar
